<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171c">
  <title>BIP-39 Randomizer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="panel" aria-labelledby="app-title">
      <p class="eyebrow">Telegram Mini App</p>
      <h1 id="app-title">BIP-39 Randomizer</h1>
      <p class="intro">Генератор английских слов BIP-39. Всё создаётся локально на вашем устройстве.</p>

      <div class="mode-switcher" aria-label="Режим генерации">
        <button class="mode-button is-selected" type="button" data-mode="random" aria-pressed="true">🎲 12 случайных слов</button>
        <button class="mode-button" type="button" data-mode="valid" aria-pressed="false">🔐 12 валидных BIP-39</button>
      </div>

      <p id="mode-description" class="mode-description" aria-live="polite"></p>
      <ol id="words" class="word-grid" aria-label="Сгенерированные слова"></ol>

      <div class="actions">
        <button id="more-button" class="action-button primary" type="button">🎲 Ещё</button>
        <button id="copy-button" class="action-button secondary" type="button">📋 Скопировать</button>
      </div>
      <p class="notice">Не используйте результаты для кошельков или хранения средств.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано!</div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
